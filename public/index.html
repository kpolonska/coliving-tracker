<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coliving Task Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 p-4 md:p-6">

  <!-- Loading screen (shown until init() completes) -->
  <div id="loadingScreen" class="min-h-screen flex items-center justify-center">
    <div class="text-gray-400 text-sm">Loading…</div>
  </div>

  <!-- New Password Modal (shown after password-recovery link) -->
  <div id="newPasswordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
      <h2 class="text-xl font-bold mb-2">Set a New Password</h2>
      <p class="text-sm text-gray-600 mb-4">Enter a new password for your account.</p>
      <input type="password" id="newPasswordInput" placeholder="New password (min. 6 characters)"
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-3">
      <div id="newPasswordError" class="hidden mb-3 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>
      <button id="newPasswordBtn" onclick="window.app.submitNewPassword()"
              class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
        Update Password
      </button>
    </div>
  </div>

  <!-- ── AUTH SCREEN ──────────────────────────────────────────────────────────── -->
  <div id="authScreen" class="hidden min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full">
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white text-center">
          <div class="w-14 h-14 mx-auto mb-3 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          </div>
          <h1 class="text-2xl font-bold">Coliving Task Tracker</h1>
          <p class="text-indigo-100 mt-1 text-sm">Sign in to manage tasks with your housemates</p>
        </div>

        <div class="p-6">
          <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
            <button id="authTabSignin" onclick="window.app.setAuthMode('signin')"
                    class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-500 auth-tab-active">
              Sign In
            </button>
            <button id="authTabSignup" onclick="window.app.setAuthMode('signup')"
                    class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-500">
              Sign Up
            </button>
          </div>

          <div id="authError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>
          <div id="authInfo" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg"></div>

          <form onsubmit="event.preventDefault(); window.app.handleAuthSubmit();" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input type="email" id="authEmail" required autocomplete="email" placeholder="you@example.com"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input type="password" id="authPassword" required autocomplete="current-password" placeholder="••••••••"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" id="authSubmitBtn"
                    class="w-full px-4 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-700 hover:to-purple-700 transition-colors">
              Sign In
            </button>
          </form>

          <div class="mt-4 text-center">
            <button onclick="window.app.sendPasswordReset()" class="text-sm text-indigo-600 hover:text-indigo-800">
              Forgot password?
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── MAIN APP ─────────────────────────────────────────────────────────────── -->
  <div id="appScreen" class="hidden max-w-6xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white">
        <div class="flex items-start justify-between flex-wrap gap-3">
          <div>
            <h1 class="text-2xl md:text-3xl font-bold">Coliving Task Tracker</h1>
            <p class="text-indigo-100 mt-1">Organize household tasks with your housemates</p>
          </div>
          <div class="flex items-center gap-3">
            <span id="userEmail" class="text-sm text-indigo-100 hidden sm:inline"></span>
            <button onclick="window.app.signOut()" class="flex items-center gap-2 px-3 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              Sign Out
            </button>
          </div>
        </div>
      </div>

      <div class="flex border-b border-gray-200 overflow-x-auto">
        <button onclick="window.app.switchTab('people')" id="tab-people"
                class="flex items-center gap-2 px-4 md:px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap tab-active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          People
        </button>
        <button onclick="window.app.switchTab('trash')" id="tab-trash"
                class="flex items-center gap-2 px-4 md:px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Trash
        </button>
        <button onclick="window.app.switchTab('cleaning')" id="tab-cleaning"
                class="flex items-center gap-2 px-4 md:px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
          Cleaning
        </button>
        <button onclick="window.app.switchTab('birthdays')" id="tab-birthdays"
                class="flex items-center gap-2 px-4 md:px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>
          Birthdays
        </button>
        <button onclick="window.app.switchTab('vitalnya')" id="tab-vitalnya"
                class="flex items-center gap-2 px-4 md:px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
          Vitalnya
        </button>
      </div>

      <div id="content" class="p-4 md:p-6"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
