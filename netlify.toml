[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."notify"]
  schedule = "*/15 * * * *"

# Branch deploys (e.g. dev branch) inherit the build config above.
# Set branch-specific env vars (Supabase dev credentials) in the
# Netlify dashboard under Site settings → Environment variables → Scopes → dev branch.
[context.branch-deploy]
  command = "echo 'branch deploy'"
